<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASAP Powertools</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --border:  #30363d;
      --text:    #e6edf3;
      --muted:   #8b949e;
      --accent:  #39d3ff;
      --green:   #3fb950;
      --yellow:  #ffd23f;
      --red:     #f85149;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ──────────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px 8px;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: .3px;
    }
    header p {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── Process list ────────────────────────────────────────── */
    #proc-section {
      flex-shrink: 0;
      padding: 10px 10px 4px;
    }
    #proc-section h2 {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
      padding-left: 4px;
    }
    .proc-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: border-color .15s, background .15s;
    }
    .proc-card:hover {
      border-color: var(--accent);
    }
    .proc-card.selected {
      border-color: var(--accent);
      background: #0f2a35;
    }
    .proc-card .proc-name {
      font-weight: 600;
      font-size: 12px;
      color: var(--text);
    }
    .proc-card.selected .proc-name {
      color: var(--accent);
    }
    .proc-card .proc-desc {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
      line-height: 1.4;
    }

    /* ── Activity feed ───────────────────────────────────────── */
    #feed-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 0 10px;
    }
    #feed-section h2 {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: var(--muted);
      margin: 8px 0 4px 4px;
      flex-shrink: 0;
    }
    #feed {
      flex: 1;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      font-family: "Cascadia Code", "Consolas", monospace;
      font-size: 11.5px;
      line-height: 1.6;
    }
    #feed::-webkit-scrollbar { width: 5px; }
    #feed::-webkit-scrollbar-track { background: transparent; }
    #feed::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .feed-line { display: block; }
    .feed-line.info   { color: var(--text); }
    .feed-line.ok     { color: var(--green); }
    .feed-line.warn   { color: var(--yellow); }
    .feed-line.err    { color: var(--red); }
    .feed-line.muted  { color: var(--muted); }
    .feed-line.accent { color: var(--accent); }

    /* ── Action bar ──────────────────────────────────────────── */
    #action-bar {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 8px 10px;
    }

    /* Batch input (hidden until "Run for everyone") */
    #batch-input-section {
      display: none;
      margin-bottom: 8px;
    }
    #batch-input-section label {
      font-size: 11px;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }
    #student-ids-input {
      width: 100%;
      height: 80px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: monospace;
      font-size: 11px;
      padding: 6px 8px;
      resize: vertical;
    }
    #student-ids-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    button {
      flex: 1;
      padding: 7px 10px;
      border: none;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
    }
    button:disabled { opacity: .4; cursor: not-allowed; }
    button:not(:disabled):hover { opacity: .85; }

    #btn-one   { background: var(--accent);  color: var(--bg); }
    #btn-all   { background: var(--green);   color: var(--bg); }
    #btn-stop  { background: var(--red);     color: #fff; display: none; }
    #btn-confirm { background: var(--accent); color: var(--bg); display: none; }
    #btn-cancel  { background: var(--surface); color: var(--muted);
                   border: 1px solid var(--border); display: none; }

    /* ── Status bar ──────────────────────────────────────────── */
    #status-bar {
      flex-shrink: 0;
      padding: 4px 14px;
      font-size: 10px;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }

    /* ── Modals ──────────────────────────────────────────────── */
    #modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.6);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 20px;
      width: 280px;
      max-width: 95%;
    }
    .modal h3 { font-size: 14px; margin-bottom: 8px; }
    .modal p  { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
    .modal input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 13px;
      padding: 7px 10px;
      margin-bottom: 12px;
    }
    .modal input:focus { outline: none; border-color: var(--accent); }
    .modal .modal-btns { display: flex; gap: 8px; }
    .modal .modal-btns button { flex: 1; }
    #modal-ok { background: var(--accent); color: var(--bg); }
    #modal-cancel { background: var(--surface); color: var(--muted);
                    border: 1px solid var(--border); }
  </style>
</head>
<body>

  <header>
    <h1>ASAP Powertools</h1>
    <p>Select a process below, then run it.</p>
  </header>

  <div id="proc-section">
    <h2>Processes</h2>
    <div id="proc-list">
      <p style="color:var(--muted);font-size:11px;padding:4px">Loading…</p>
    </div>
  </div>

  <div id="feed-section">
    <h2>Activity</h2>
    <div id="feed">
      <span class="feed-line muted">Select a process to get started.</span>
    </div>
  </div>

  <div id="action-bar">
    <div id="batch-input-section">
      <label>Paste student IDs — one per line:</label>
      <textarea id="student-ids-input" placeholder="12345&#10;67890&#10;11223"></textarea>
    </div>
    <div class="btn-row">
      <button id="btn-one"     disabled>▶ Run for one student</button>
      <button id="btn-all"     disabled>⚡ Run for everyone</button>
      <button id="btn-stop"            >■ Stop</button>
      <button id="btn-confirm"         >✓ Run batch</button>
      <button id="btn-cancel"          >✕ Cancel</button>
    </div>
  </div>

  <div id="status-bar">Ready.</div>

  <!-- Single-student ID modal -->
  <div id="modal-overlay">
    <div class="modal">
      <h3>Run for one student</h3>
      <p>Enter the student's ASAP ID:</p>
      <input id="modal-input" type="text" placeholder="e.g. 12345" autocomplete="off">
      <div class="modal-btns">
        <button id="modal-ok">Run</button>
        <button id="modal-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
